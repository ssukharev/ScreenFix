name: Windows portable package

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Run core checks
        run: dotnet run --project tests/ScreenFix.Core.Tests/ScreenFix.Core.Tests.csproj --configuration Release --no-launch-profile

      - name: Run display structure and calculation checks
        run: dotnet run --project tests/ScreenFix.Display.Tests/ScreenFix.Display.Tests.csproj --configuration Release --no-launch-profile

      - name: Publish portable Windows x64 package
        shell: pwsh
        run: ./scripts/Publish-Portable.ps1 -Runtime win-x64 -SkipTests

      - name: Upload portable package
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/ScreenFix-win-x64.zip
          if-no-files-found: error
          archive: false
